<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Formulários de serviços.">
  <title>Serviços</title>
  <style>
    * { box-sizing: border-box; }
    html { font-family: Arial, Helvetica, sans-serif; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      background:
        linear-gradient(rgba(0,0,0,.68), rgba(0,0,0,.68)),
        url("https://mundodoaredarefrigeracao.com.br/wp-content/uploads/2019/06/gera%C3%A7%C3%A3o-de-energia.jpg") center/cover no-repeat fixed;
    }
    main {
      width: 100%;
      max-width: 620px;
      padding: 28px;
      border-radius: 16px;
      background: rgba(18,18,18,.88);
      box-shadow: 0 12px 30px rgba(0,0,0,.35);
      text-align: center;
    }
    h1 {
      margin: 0 0 10px;
      color: #ffd54a;
      font-size: clamp(1.7rem, 5vw, 2.4rem);
    }
    p { margin: 0 0 24px; line-height: 1.5; color: #eee; }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
    .button {
      display: block;
      width: 100%;
      padding: 16px 18px;
      border-radius: 10px;
      background: #f59e0b;
      color: #171717;
      font-weight: 700;
      text-decoration: none;
      transition: transform .15s ease, background-color .15s ease;
    }
    .button:hover, .button:focus-visible {
      background: #fbbf24;
      transform: translateY(-1px);
      outline: 3px solid rgba(255,255,255,.75);
      outline-offset: 2px;
    }
    .back-link {
      display: inline-block;
      margin-top: 24px;
      color: #fff;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    @media (max-width: 480px) {
      body { padding: 14px; background-attachment: scroll; }
      main { padding: 22px 16px; border-radius: 12px; }
      .button { padding: 16px 14px; font-size: .98rem; }
    }
</style>
</head>
<body>
  <main>
    <h1>Área de Serviços</h1>
    <p>Selecione o formulário de serviço que deseja preencher.</p>
    <nav aria-label="Formulários de serviços">
      <ul>
        <li><a class="button" href="https://forms.gle/xs2zTUoUiND64XNF9" target="_blank" rel="noopener noreferrer">Serviço B</a></li>
        <li><a class="button" href="https://forms.gle/WTWcFcZnAMdQ1DJc7" target="_blank" rel="noopener noreferrer">Serviço C</a></li>
        <li><a class="button" href="https://forms.gle/yKDz6z5eG2nF7aaCA" target="_blank" rel="noopener noreferrer">Serviço H</a></li>
        <li><a class="button" href="https://forms.gle/gdfj7miZbzFJdH4H7" target="_blank" rel="noopener noreferrer">Serviço Z</a></li>
      </ul>
    </nav>
    <a class="back-link" href="index.html">Voltar ao início</a>
  </main>
</body>
</html>
